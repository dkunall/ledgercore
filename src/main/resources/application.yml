spring:
  application:
    name: ledgercore
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/ledgercore?options=-c%20lock_timeout=2000%20-c%20statement_timeout=10000
    username: ledgercore
    password: ${DB_PASSWORD:ledgercore}
    hikari:
      maximum-pool-size: 20
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 200ms
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/ledgercore
          audiences: ledgercore

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

ledgercore:
  accounts:
    supported-currencies: INR
